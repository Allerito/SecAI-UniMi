name: Build and Deploy Quartz

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quartz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Quartz website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Quartz configuration
        run: |
          test -f .github/quartz/quartz.config.yaml
          test -f .github/quartz/prepare-content.mjs
          test -d materials

      - name: Clone Quartz v5
        run: |
          git clone --depth 1 --branch v5 https://github.com/jackyzha0/quartz.git site
          cp .github/quartz/quartz.config.yaml site/quartz.config.yaml
          sed -i 's/gitignore: true/gitignore: false/' site/quartz/util/glob.ts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Install Quartz plugins
        working-directory: site
        run: node quartz/bootstrap-cli.mjs plugin install --from-config

      - name: Prepare multilingual content
        run: node .github/quartz/prepare-content.mjs --source materials --output site/content

      - name: Build Quartz
        working-directory: site
        run: node quartz/bootstrap-cli.mjs build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
