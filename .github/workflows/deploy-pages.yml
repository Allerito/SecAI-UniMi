name: Build and Deploy Quartz

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quartz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Quartz website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify Quartz installation
        run: |
          test -f site/package.json
          test -f site/package-lock.json
          test -f site/quartz.config.yaml
          test -d Ita

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Install Quartz plugins
        working-directory: site
        run: npx quartz plugin install --from-config

      - name: Prepare Markdown content
        run: |
          rm -rf site/content
          mkdir -p site/content/Ita site/content/Eng

          cp -a Ita/. site/content/Ita/

          if [ -d Eng ]; then
            cp -a Eng/. site/content/Eng/
          fi

          if [ ! -f site/content/Eng/index.md ]; then
            cat > site/content/Eng/index.md <<'EOF'
          ---
          title: English
          ---

          English study notes will be added here.
          EOF
          fi

      - name: Create homepage
        run: |
          cat > site/content/index.md <<'EOF'
          ---
          title: SecAI-UniMi
          ---

          # SecAI-UniMi

          Appunti di Sicurezza Informatica e Intelligenza Artificiale.
          Security and Artificial Intelligence study notes.

          ## Scegli la lingua / Select your language

          - [Italiano](./Ita/)
          - [English](./Eng/)
          EOF

      - name: Build Quartz
        working-directory: site
        run: npx quartz build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
