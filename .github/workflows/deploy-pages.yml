name: Build and Deploy Quartz

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quartz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Quartz website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/quartz/package-lock.json

      - name: Prepare pinned Quartz
        run: node .github/quartz/setup.mjs

      - name: Install locked dependencies and theme
        working-directory: tmp/quartz-build
        run: npm ci

      - name: Prepare multilingual content
        run: node .github/quartz/prepare-content.mjs --source materials --output tmp/quartz-build/content

      - name: Build Quartz
        working-directory: tmp/quartz-build
        run: node quartz/bootstrap-cli.mjs build

      - name: Test publication guards
        run: node --test .github/quartz/verify-output.test.mjs

      - name: Verify website before publishing
        run: node .github/quartz/verify-output.mjs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v4
        with:
          path: tmp/quartz-build/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
