<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
  <title id="title">Funzione omografica e funzione irrazionale</title>
  <desc id="desc">A sinistra l'iperbole equilatera traslata con asintoto verticale e orizzontale; a destra la semicirconferenza y = radice di R quadro meno x quadro.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --panel: #f8fafc;
      --border: #cbd5e1;
      --grid: #e2e8f0;
      --axis: #334155;
      --txt: #0f172a;
      --sub: #334155;
      --blue: #0284c7;
      --purple: #7c3aed;
      --red: #e11d48;
      --orange: #d97706;
      --green: #16a34a;
      --muted: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --panel: #1e2028;
        --border: #3f4454;
        --grid: #2c303d;
        --axis: #cbd5e1;
        --txt: #f8fafc;
        --sub: #cbd5e1;
        --blue: #38bdf8;
        --purple: #a78bfa;
        --red: #fb7185;
        --orange: #fbbf24;
        --green: #4ade80;
        --muted: #94a3b8;
      }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .grid { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 4 4; }
    .axis { stroke: var(--axis); stroke-width: 2; fill: none; }
    . guide, .dash { stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .asym { stroke: var(--red); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .hline { stroke: var(--orange); stroke-width: 2.2; stroke-dasharray: 6 4; fill: none; }
    .c-blue { stroke: var(--blue); fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .c-purple { stroke: var(--purple); fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .c-red { stroke: var(--red); fill: none; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
    .c-green { stroke: var(--green); fill: none; stroke-width: 3.5; stroke-dasharray: 7 4; stroke-linecap: round; }
    .pt { fill: var(--bg); stroke: var(--green); stroke-width: 3.2; }
    .pt-red { fill: var(--bg); stroke: var(--red); stroke-width: 3.2; }
    .txt { fill: var(--txt); font: 600 18px system-ui, -apple-system, sans-serif; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
    .title-bg { fill: var(--txt); font: 600 18px system-ui, -apple-system, sans-serif; }
    .sub { fill: var(--sub); font: 14.5px system-ui, -apple-system, sans-serif; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
    .caption { fill: var(--sub); font: 14.5px system-ui, -apple-system, sans-serif; }
</style>
  <rect class="bg" width="920" height="350" rx="12"/>

  <g transform="translate(22 20)">
    <rect class="panel" width="424" height="310" rx="10"/>
    <text class="txt" x="20" y="32">Funzione omografica: y = (ax+b)/(cx+d)</text>
    <line class="axis" x1="35" y1="185" x2="395" y2="185"/>
    <line class="axis" x1="140" y1="260" x2="140" y2="52"/>
    <line class="asym" x1="202.4" y1="260" x2="202.4" y2="52"/>
    <line class="asym" x1="35" y1="137" x2="395" y2="137"/>
    <path class="c-blue" d="M51.6 149.41 L53.26 149.55 L54.92 149.69 L56.57 149.84 L58.23 149.98 L59.89 150.14 L61.55 150.29 L63.2 150.45 L64.86 150.61 L66.52 150.78 L68.17 150.95 L69.83 151.12 L71.49 151.3 L73.15 151.48 L74.8 151.67 L76.46 151.86 L78.12 152.06 L79.78 152.27 L81.44 152.48 L83.09 152.69 L84.75 152.91 L86.41 153.14 L88.06 153.37 L89.72 153.61 L91.38 153.86 L93.04 154.12 L94.69 154.38 L96.35 154.65 L98.01 154.93 L99.67 155.22 L101.33 155.52 L102.98 155.83 L104.64 156.15 L106.3 156.48 L107.95 156.82 L109.61 157.18 L111.27 157.54 L112.93 157.92 L114.59 158.32 L116.24 158.73 L117.9 159.15 L119.56 159.6 L121.22 160.06 L122.87 160.54 L124.53 161.04 L126.19 161.56 L127.84 162.11 L129.5 162.68 L131.16 163.28 L132.82 163.9 L134.47 164.56 L136.13 165.25 L137.79 165.97 L139.45 166.74 L141.1 167.54 L142.76 168.39 L144.42 169.29 L146.08 170.24 L147.73 171.24 L149.39 172.32 L151.05 173.46 L152.71 174.67 L154.37 175.97 L156.02 177.36 L157.68 178.86 L159.34 180.47 L161 182.21 L162.65 184.1 L164.31 186.15 L165.97 188.38 L167.63 190.83 L169.28 193.53 L170.94 196.5 L172.6 199.81 L174.25 203.51 L175.91 207.67 L177.57 212.39 L179.23 217.79 L180.88 224.01 L182.54 231.27 L184.2 239.86"/>
    <path class="c-blue" d="M220.6 34.14 L222.26 42.73 L223.92 49.99 L225.57 56.21 L227.23 61.61 L228.89 66.33 L230.55 70.49 L232.2 74.19 L233.86 77.5 L235.52 80.47 L237.18 83.17 L238.83 85.62 L240.49 87.85 L242.15 89.9 L243.81 91.79 L245.46 93.53 L247.12 95.14 L248.78 96.64 L250.44 98.03 L252.09 99.33 L253.75 100.54 L255.41 101.68 L257.06 102.76 L258.72 103.76 L260.38 104.71 L262.04 105.61 L263.69 106.46 L265.35 107.26 L267.01 108.03 L268.67 108.75 L270.33 109.44 L271.98 110.1 L273.64 110.72 L275.3 111.32 L276.96 111.89 L278.61 112.44 L280.27 112.96 L281.93 113.46 L283.59 113.94 L285.24 114.4 L286.9 114.85 L288.56 115.27 L290.22 115.68 L291.87 116.08 L293.53 116.46 L295.19 116.82 L296.85 117.18 L298.5 117.52 L300.16 117.85 L301.82 118.17 L303.48 118.48 L305.13 118.78 L306.79 119.07 L308.45 119.35 L310.11 119.62 L311.76 119.88 L313.42 120.14 L315.08 120.39 L316.74 120.63 L318.39 120.86 L320.05 121.09 L321.71 121.31 L323.37 121.52 L325.02 121.73 L326.68 121.94 L328.34 122.14 L330 122.33 L331.65 122.52 L333.31 122.7 L334.97 122.88 L336.63 123.05 L338.28 123.22 L339.94 123.39 L341.6 123.55 L343.25 123.71 L344.91 123.86 L346.57 124.02 L348.23 124.16 L349.88 124.31 L351.54 124.45 L353.2 124.59"/>
    <circle class="pt" cx="202.4" cy="137" r="5"/>
    <text class="sub" x="212.4" y="157" text-anchor="start">C(-d/c, a/c)</text>
    <text class="sub" x="210.4" y="252" text-anchor="start">x = -d/c</text>
    <text class="sub" x="45" y="127" text-anchor="start">y = a/c</text>
    <text class="caption" x="212" y="290" text-anchor="middle">Dominio: x ≠ -d/c; Codominio: y ≠ a/c</text>
  </g>

  <g transform="translate(474 20)">
    <rect class="panel" width="424" height="310" rx="10"/>
    <text class="txt" x="20" y="32">Semicirconferenza: y = √(R² - x²)</text>
    <line class="axis" x1="35" y1="215" x2="395" y2="215"/>
    <line class="axis" x1="212" y1="255" x2="212" y2="52"/>
    <path class="c-blue" d="M 100 215 A 112 112 0 0 1 324 215"/>
    <circle class="pt" cx="100" cy="215" r="5"/>
    <circle class="pt" cx="324" cy="215" r="5"/>
    <circle class="pt" cx="212" cy="103" r="5"/>
    <text class="sub" x="100" y="237" text-anchor="middle">-R</text>
    <text class="sub" x="324" y="237" text-anchor="middle">+R</text>
    <text class="sub" x="224" y="97" text-anchor="start">(0, R)</text>
    <text class="caption" x="212" y="290" text-anchor="middle">C.E.: R² - x² ≥ 0 ⟺ -R ≤ x ≤ R (con y ≥ 0)</text>
  </g>
</svg>
