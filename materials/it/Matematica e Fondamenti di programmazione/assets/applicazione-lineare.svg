<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Applicazione lineare descritta da una matrice</title>
  <desc id="desc">A sinistra i versori canonici del dominio; una freccia etichettata A conduce alle loro immagini, che diventano le colonne della matrice.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; }
    .axis { stroke: #475569; stroke-width: 2; }
    .e1 { stroke: #2563eb; stroke-width: 5; fill: none; marker-end: url(#b); stroke-linecap: round; }
    .e2 { stroke: #7c3aed; stroke-width: 5; fill: none; marker-end: url(#p); stroke-linecap: round; }
    .map { stroke: #f97316; stroke-width: 5; fill: none; marker-end: url(#head); stroke-linecap: round; }
    .txt { fill: #0f172a; font: 600 23px system-ui, sans-serif; }
    .small { fill: #334155; font: 600 18px system-ui, sans-serif; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #17191f; }
      .panel { fill: #20242d; stroke: #475569; }
      .axis { stroke: #cbd5e1; }
      .txt { fill: #f8fafc; }
      .small { fill: #cbd5e1; stroke: #20242d; }
      .e1 { stroke: #60a5fa; }
      .e2 { stroke: #c4b5fd; }
    }
  </style>
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto">
      <path d="M0 0.5 L8 3.5 L0 6.5 Z" fill="context-stroke"/>
    </marker>
    <marker id="b" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto">
      <path d="M0 0.5 L8 3.5 L0 6.5 Z" fill="context-stroke"/>
    </marker>
    <marker id="p" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto">
      <path d="M0 0.5 L8 3.5 L0 6.5 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect class="bg" width="1100" height="470" rx="14"/>
  <g transform="translate(25 25)">
    <rect class="panel" width="360" height="390" rx="12"/>
    <text class="txt" x="180" y="38" text-anchor="middle">Dominio (Base canonica)</text>
    <path class="axis" d="M55 315H320M95 350V85"/>
    <path class="e1" d="M95 315H265"/>
    <path class="e2" d="M95 315V145"/>
    <text class="small" x="260" y="344" text-anchor="middle">e₁</text>
    <text class="small" x="76" y="152" text-anchor="end">e₂</text>
  </g>
  <path class="map" d="M415 220H675"/>
  <text class="txt" x="545" y="192" text-anchor="middle">L(x) = A · x</text>
  <g transform="translate(710 25)">
    <rect class="panel" width="360" height="390" rx="12"/>
    <text class="txt" x="180" y="38" text-anchor="middle">Codominio (Immagini)</text>
    <path class="axis" d="M55 315H320M95 350V85"/>
    <path class="e1" d="M95 315L295 245"/>
    <path class="e2" d="M95 315L185 115"/>
    <text class="small" x="265" y="226" text-anchor="middle">L(e₁)</text>
    <text class="small" x="200" y="122" text-anchor="start">L(e₂)</text>
    <text class="small" x="180" y="375" text-anchor="middle">L(e₁), L(e₂) sono le colonne di A</text>
  </g>
</svg>
