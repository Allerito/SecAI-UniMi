<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Applicazione lineare descritta da una matrice</title><desc id="desc">A sinistra i versori canonici del dominio; una freccia etichettata A conduce alle loro immagini, che diventano le colonne della matrice.</desc>
  <style>:root{color-scheme:light dark}.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.axis{stroke:#475569;stroke-width:2}.e1{stroke:#2563eb;stroke-width:5}.e2{stroke:#7c3aed;stroke-width:5}.map{stroke:#f97316;stroke-width:5;fill:none;marker-end:url(#head)}.txt{fill:#0f172a;font:23px system-ui,sans-serif}.small{fill:#334155;font:18px system-ui,sans-serif}@media(prefers-color-scheme:dark){.bg{fill:#17191f}.panel{fill:#20242d;stroke:#475569}.axis{stroke:#cbd5e1}.txt{fill:#f8fafc}.small{fill:#cbd5e1}.e1{stroke:#60a5fa}.e2{stroke:#c4b5fd}}</style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f97316"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7c3aed"/></marker></defs>
  <rect class="bg" width="1100" height="470" rx="14"/>
  <g transform="translate(25 25)"><rect class="panel" width="360" height="390" rx="12"/><text class="txt" x="180" y="38" text-anchor="middle">Dominio</text><path class="axis" d="M55 315H320M95 350V85"/><path class="e1" d="M95 315H265" marker-end="url(#b)"/><path class="e2" d="M95 315V145" marker-end="url(#p)"/><text class="small" x="250" y="345">e₁</text><text class="small" x="65" y="160">e₂</text></g>
  <path class="map" d="M415 220H675"/><text class="txt" x="545" y="185" text-anchor="middle">L(x)=Ax</text>
  <g transform="translate(710 25)"><rect class="panel" width="360" height="390" rx="12"/><text class="txt" x="180" y="38" text-anchor="middle">Codominio</text><path class="axis" d="M55 315H320M95 350V85"/><path class="e1" d="M95 315L295 245" marker-end="url(#b)"/><path class="e2" d="M95 315L185 115" marker-end="url(#p)"/><text class="small" x="245" y="220">L(e₁)</text><text class="small" x="195" y="125">L(e₂)</text><text class="small" x="180" y="375" text-anchor="middle">le immagini sono le colonne di A</text></g>
</svg>
