<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
  <title id="title">Numero complesso nel piano di Gauss</title>
  <desc id="desc">Il punto z uguale a più ib è rappresentato da un vettore di modulo rho e argomento theta.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .axis { stroke: #334155; stroke-width: 3; }
    .guide { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; }
    .vector { stroke: #2563eb; stroke-width: 5; fill: none; marker-end: url(#head); stroke-linecap: round; }
    .angle { stroke: #f97316; stroke-width: 4; fill: none; }
    .point { fill: #7c3aed; stroke: #ffffff; stroke-width: 2.5; }
    .txt { fill: #0f172a; font: 600 22px system-ui, sans-serif; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; }
    .small { fill: #334155; font: 600 19px system-ui, sans-serif; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #17191f; }
      .grid { stroke: #343946; }
      .axis { stroke: #e2e8f0; }
      .guide { stroke: #64748b; }
      .txt { fill: #f8fafc; stroke: #17191f; }
      .small { fill: #cbd5e1; stroke: #17191f; }
      .vector { stroke: #60a5fa; }
      .point { fill: #c4b5fd; stroke: #17191f; }
    }
  </style>
  <defs>
    <marker id="head" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto">
      <path d="M0 0.5 L8 3.5 L0 6.5 Z" fill="context-stroke"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="560" rx="14"/>
  <g>
    <path class="grid" d="M100 100H820M100 180H820M100 260H820M100 340H820M100 420H820M180 60V500M260 60V500M340 60V500M420 60V500M500 60V500M580 60V500M660 60V500M740 60V500"/>
    <path class="axis" d="M70 340H850M340 500V45"/>
    <path class="axis" d="m850 340-14-8v16zM340 45l-8 14h16z"/>
    <text class="txt" x="805" y="322">Re</text>
    <text class="txt" x="358" y="72">Im</text>
    <path class="guide" d="M660 140V340M340 140H660"/>
    <path class="angle" d="M 435 340 A 95 95 0 0 0 420.56 289.66"/>
    <path class="vector" d="M340 340L649 146.9"/>
    <circle class="point" cx="660" cy="140" r="8.5"/>
    <text class="txt" x="678" y="136">z = a + ib</text>
    <text class="small" x="660" y="368" text-anchor="middle">a</text>
    <text class="small" x="322" y="147" text-anchor="end">b</text>
    <text class="txt" x="454" y="314" text-anchor="middle">θ</text>
    <text class="txt" x="488" y="218" text-anchor="middle" transform="rotate(-32 488 218)">ρ = |z|</text>
    <text class="small" x="450" y="535" text-anchor="middle">Forma trigonometrica: z = ρ(cos θ + i sin θ),   con a = ρ cos θ,  b = ρ sin θ</text>
  </g>
</svg>
