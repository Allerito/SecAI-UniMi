<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Retta e piano nello spazio</title><desc id="desc">Un piano è mostrato con due vettori generatori e un vettore normale; una retta parametrica attraversa lo spazio con il proprio vettore direzione.</desc>
  <style>:root{color-scheme:light dark}.bg{fill:#fff}.plane{fill:#bfdbfe;fill-opacity:.62;stroke:#2563eb;stroke-width:3}.axis{stroke:#475569;stroke-width:3}.dir{stroke:#7c3aed;stroke-width:6;fill:none;marker-end:url(#p)}.normal{stroke:#f97316;stroke-width:6;fill:none;marker-end:url(#o)}.basis{stroke:#059669;stroke-width:5;fill:none;marker-end:url(#g)}.txt{fill:#0f172a;font:22px system-ui,sans-serif}.small{fill:#334155;font:18px system-ui,sans-serif}@media(prefers-color-scheme:dark){.bg{fill:#17191f}.plane{fill:#1e3a8a;fill-opacity:.7;stroke:#60a5fa}.axis{stroke:#cbd5e1}.dir{stroke:#c4b5fd}.normal{stroke:#fb923c}.basis{stroke:#34d399}.txt{fill:#f8fafc}.small{fill:#cbd5e1}}</style>
  <defs><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7c3aed"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f97316"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#059669"/></marker></defs>
  <rect class="bg" width="1000" height="570" rx="14"/><text class="txt" x="500" y="42" text-anchor="middle">Geometria nello spazio</text>
  <polygon class="plane" points="150,390 590,470 840,260 400,180"/><text class="txt" x="720" y="360">piano π</text>
  <circle cx="430" cy="330" r="8" fill="#0f172a"/><text class="small" x="445" y="350">P</text>
  <path class="basis" d="M430 330L650 370"/><path class="basis" d="M430 330L570 215"/><text class="small" x="640" y="400">u</text><text class="small" x="575" y="220">v</text>
  <path class="normal" d="M430 330L430 95"/><text class="txt" x="450" y="120">n</text><path class="axis" d="M430 330l20 4l-4-20" fill="none"/>
  <path class="dir" d="M95 480L850 95"/><text class="txt" x="790" y="105">retta r</text><text class="small" x="665" y="155">direzione d</text>
  <text class="small" x="500" y="535" text-anchor="middle">π: n·(x−P)=0       r: x=Q+td</text>
</svg>
