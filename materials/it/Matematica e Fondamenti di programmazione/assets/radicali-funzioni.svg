    <circle class="pt" cx="95" cy="210" r="5"/>
    <circle class="pt" cx="157" cy="148" r="5"/>
    <circle class="pt" cx="343" cy="86" r="5"/>
    <text class="sub" x="87" y="230" text-anchor="end">O(0,0)</text>
    <text class="sub" x="157" y="136" text-anchor="middle">(1, 1)</text>
    <text class="sub" x="343" y="74" text-anchor="middle">(4, 2)</text>
    <text class="sub" x="392" y="202" text-anchor="end">x</text>
    <text class="sub" x="105" y="66">y</text>
    <text class="caption" x="212" y="290" text-anchor="middle">Non definita per x &lt; 0; assume solo valori y ≥ 0</text>
  </g>

  <g transform="translate(474 20)">
    <rect class="panel" width="424" height="310" rx="10"/>
    <text class="txt" x="20" y="32">Indice dispari: y = ³√x (Dominio: ℝ)</text>
