    <text class="sub" x="217" y="176">O(0,0)</text>
    <text class="sub" x="259" y="94" text-anchor="middle">(1, 1)</text>
    <text class="sub" x="155" y="232" text-anchor="middle">(-1, -1)</text>
    <text class="sub" x="392" y="150" text-anchor="end">x</text>
    <text class="sub" x="217" y="66">y</text>
    <text class="caption" x="212" y="290" text-anchor="middle">Definita per ogni x ∈ ℝ; funzione dispari (conserva il segno)</text>
  </g>
</svg>
