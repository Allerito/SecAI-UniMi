<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Lettura grafica di equazioni e disequazioni di primo grado</title>
  <desc id="desc">La retta y uguale 2x meno 2 incontra l'asse y in (0,-2), l'asse x in (1,0) e passa per (2,2). A sinistra di x=1 la funzione è negativa, a destra è positiva.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .grid { stroke: #d8dee9; stroke-width: 1; }
    .axis { stroke: #344054; stroke-width: 2; }
    .tick { stroke: #667085; stroke-width: 1.5; }
    .txt { fill: #1d2939; font: 600 18px system-ui, sans-serif; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .small { fill: #475467; font: 15px system-ui, sans-serif; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    .positive { stroke: #1677b8; fill: #1677b8; stroke-linecap: round; }
    .negative { stroke: #d05a32; fill: #d05a32; stroke-linecap: round; }
    .neutral { stroke: #344054; fill: #ffffff; }
    .pt-grid { fill: #1677b8; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #17191f; }
      .grid { stroke: #343946; }
      .axis { stroke: #d0d5dd; }
      .tick { stroke: #98a2b3; }
      .txt { fill: #f2f4f7; stroke: #17191f; }
      .small { fill: #d0d5dd; stroke: #17191f; }
      .neutral { stroke: #d0d5dd; fill: #17191f; }
      .positive { stroke: #64b5e8; fill: #64b5e8; }
      .negative { stroke: #f08a67; fill: #f08a67; }
      .pt-grid { fill: #64b5e8; }
    }
  </style>
  <rect class="bg" width="900" height="430" rx="12"/>
  <text class="txt" x="32" y="38">Esempio: f(x) = 2x − 2</text>

  <g aria-label="Piano cartesiano">
    <path class="grid" d="M70 90H850 M70 140H850 M70 190H850 M70 240H850 M70 290H850"/>
    <path class="grid" d="M130 65V315 M250 65V315 M370 65V315 M490 65V315 M610 65V315 M730 65V315"/>
    <path class="axis" d="M60 190H860 M370 60V320"/>
    <path class="axis" d="m860 190-12-7v14z M370 60l-7 12h14z"/>
    <text class="small" x="842" y="178">x</text>
    <text class="small" x="384" y="76">y</text>

    <path class="negative" d="M346 310L490 190" stroke-width="5" fill="none"/>
    <path class="positive" d="M490 190L634 70" stroke-width="5" fill="none"/>

    <circle class="neutral" cx="370" cy="290" r="5.5" stroke-width="2.5"/>
    <circle class="neutral" cx="610" cy="90" r="5.5" stroke-width="2.5"/>
    <circle class="neutral" cx="490" cy="190" r="7" stroke-width="3"/>

    <text class="small" x="355" y="295" text-anchor="end">(0, −2)</text>
    <text class="txt" x="490" y="220" text-anchor="middle">1</text>
    <text class="small" x="506" y="178" text-anchor="start">f(1) = 0</text>
    <text class="small" x="624" y="95" text-anchor="start">(2, 2)</text>
  </g>

  <g aria-label="Schema del segno">
    <text class="small" x="70" y="355">valori di x</text>
    <path class="axis" d="M190 350H830"/>
    <path class="axis" d="m830 350-12-7v14z"/>
    <path class="negative" d="M200 350H482" stroke-width="9"/>
    <path class="positive" d="M498 350H815" stroke-width="9"/>
    <circle class="neutral" cx="490" cy="350" r="8" stroke-width="3"/>
    <text class="txt" x="340" y="388" text-anchor="middle">f(x) &lt; 0  (x &lt; 1)</text>
    <text class="txt" x="655" y="388" text-anchor="middle">f(x) &gt; 0  (x &gt; 1)</text>
    <text class="small" x="490" y="415" text-anchor="middle">x = 1</text>
  </g>
</svg>
