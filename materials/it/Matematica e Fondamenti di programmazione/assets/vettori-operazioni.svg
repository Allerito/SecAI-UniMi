<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Componenti, somma e prodotto scalare tra vettori</title>
  <desc id="desc">Tre pannelli mostrano le componenti cartesiane di un vettore, la regola del parallelogramma e l'angolo collegato al prodotto scalare.</desc>
  <style>
    :root{color-scheme:light dark}.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.axis{stroke:#475569;stroke-width:2}.guide{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}.u{stroke:#2563eb;stroke-width:5;fill:none}.v{stroke:#7c3aed;stroke-width:5;fill:none}.sum{stroke:#059669;stroke-width:5;fill:none}.angle{stroke:#f97316;stroke-width:4;fill:none}.txt{fill:#0f172a;font:22px system-ui,sans-serif}.small{fill:#334155;font:18px system-ui,sans-serif}
    @media(prefers-color-scheme:dark){.bg{fill:#17191f}.panel{fill:#20242d;stroke:#475569}.axis{stroke:#cbd5e1}.guide{stroke:#64748b}.txt{fill:#f8fafc}.small{fill:#cbd5e1}.u{stroke:#60a5fa}.v{stroke:#c4b5fd}.sum{stroke:#34d399}}
  </style>
  <defs><marker id="bu" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#2563eb"/></marker><marker id="pv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#7c3aed"/></marker><marker id="gs" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#059669"/></marker></defs>
  <rect class="bg" width="1200" height="430" rx="14"/>
  <g transform="translate(15 15)"><rect class="panel" width="380" height="400" rx="12"/><text class="txt" x="190" y="38" text-anchor="middle">Componenti</text><path class="axis" d="M55 330H340M85 360V70"/><path class="u" d="M85 330L300 115" marker-end="url(#bu)"/><path class="guide" d="M300 115V330M85 115H300"/><text class="small" x="292" y="355">a</text><text class="small" x="58" y="120">b</text><text class="small" x="230" y="188">v=(a,b)</text></g>
  <g transform="translate(410 15)"><rect class="panel" width="380" height="400" rx="12"/><text class="txt" x="190" y="38" text-anchor="middle">Somma</text><path class="u" d="M70 330L220 260" marker-end="url(#bu)"/><path class="v" d="M70 330L145 125" marker-end="url(#pv)"/><path class="guide" d="M220 260L295 55M145 125L295 55"/><path class="sum" d="M70 330L295 55" marker-end="url(#gs)"/><text class="small" x="145" y="315">u</text><text class="small" x="92" y="210">v</text><text class="small" x="220" y="170">u+v</text></g>
  <g transform="translate(805 15)"><rect class="panel" width="380" height="400" rx="12"/><text class="txt" x="190" y="38" text-anchor="middle">Prodotto scalare</text><path class="u" d="M70 330L325 330" marker-end="url(#bu)"/><path class="v" d="M70 330L265 135" marker-end="url(#pv)"/><path class="angle" d="M155 330A85 85 0 0 0 130 270"/><text class="txt" x="145" y="285">θ</text><text class="small" x="190" y="375" text-anchor="middle">u·v = ‖u‖ ‖v‖ cos θ</text></g>
</svg>
