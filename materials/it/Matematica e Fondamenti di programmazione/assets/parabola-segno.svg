    <rect class="panel" width="408" height="420" rx="10"/>
    <text class="txt" x="20" y="34">a &gt; 0</text>
    <text class="small" x="388" y="34" text-anchor="end">concavità verso l’alto (∪)</text>
    <path class="grid" d="M36 90H382 M36 150H382 M36 210H382 M36 270H382"/>
    <path class="axis" d="M30 180H390 M204 68V292"/>
    <path class="positive" d="M82 84.54 L83.76 89.16 L85.52 93.72 L87.28 98.21 L89.04 102.63 L90.8 106.99 L92.56 111.28 L94.32 115.5 L96.08 119.65 L97.84 123.74 L99.6 127.76 L101.36 131.72 L103.12 135.6 L104.88 139.42 L106.64 143.17 L108.4 146.86 L110.16 150.47 L111.92 154.02 L113.68 157.5 L115.44 160.92 L117.2 164.27 L118.96 167.55 L120.72 170.76 L122.48 173.91 L124.24 176.99 L126 180"/>
    <path class="negative" d="M126 180 L129.12 185.17 L132.24 190.14 L135.36 194.89 L138.48 199.43 L141.6 203.76 L144.72 207.88 L147.84 211.79 L150.96 215.48 L154.08 218.97 L157.2 222.24 L160.32 225.3 L163.44 228.15 L166.56 230.79 L169.68 233.22 L172.8 235.44 L175.92 237.45 L179.04 239.24 L182.16 240.83 L185.28 242.2 L188.4 243.36 L191.52 244.31 L194.64 245.05 L197.76 245.58 L200.88 245.89 L204 246 L207.12 245.89 L210.24 245.58 L213.36 245.05 L216.48 244.31 L219.6 243.36 L222.72 242.2 L225.84 240.83 L228.96 239.24 L232.08 237.45 L235.2 235.44 L238.32 233.22 L241.44 230.79 L244.56 228.15 L247.68 225.3 L250.8 222.24 L253.92 218.97 L257.04 215.48 L260.16 211.79 L263.28 207.88 L266.4 203.76 L269.52 199.43 L272.64 194.89 L275.76 190.14 L278.88 185.17 L282 180"/>
    <path class="positive" d="M282 180 L283.76 176.99 L285.52 173.91 L287.28 170.76 L289.04 167.55 L290.8 164.27 L292.56 160.92 L294.32 157.5 L296.08 154.02 L297.84 150.47 L299.6 146.86 L301.36 143.17 L303.12 139.42 L304.88 135.6 L306.64 131.72 L308.4 127.76 L310.16 123.74 L311.92 119.65 L313.68 115.5 L315.44 111.28 L317.2 106.99 L318.96 102.63 L320.72 98.21 L322.48 93.72 L324.24 89.16 L326 84.54"/>
    <circle class="root" cx="126" cy="180" r="6"/>
    <circle class="root" cx="282" cy="180" r="6"/>
    <text class="small" x="112" y="204" text-anchor="middle">x₁</text>
    <text class="small" x="296" y="204" text-anchor="middle">x₂</text>
    <path class="positive" d="M48 322H120 M288 322H360" stroke-width="8"/>
    <path class="negative" d="M132 322H276" stroke-width="8"/>
    <circle class="root" cx="126" cy="322" r="7"/>
    <circle class="root" cx="282" cy="322" r="7"/>
    <text class="small" x="84" y="352" text-anchor="middle">+</text>
    <text class="small" x="204" y="352" text-anchor="middle">−</text>
    <text class="small" x="324" y="352" text-anchor="middle">+</text>
    <text class="small" x="20" y="382">f(x) &gt; 0: valori esterni (x &lt; x₁ ∨ x &gt; x₂)</text>
    <text class="small" x="20" y="406">f(x) &lt; 0: valori interni (x₁ &lt; x &lt; x₂)</text>
  </g>

  <g transform="translate(464 62)" aria-label="Parabola con concavità verso il basso">
    <rect class="panel" width="408" height="420" rx="10"/>
    <text class="txt" x="20" y="34">a &lt; 0</text>
    <text class="small" x="388" y="34" text-anchor="end">concavità verso il basso (∩)</text>
    <path class="grid" d="M36 90H382 M36 150H382 M36 210H382 M36 270H382"/>
    <path class="axis" d="M30 180H390 M204 68V292"/>
    <path class="negative" d="M82 275.46 L83.76 270.84 L85.52 266.28 L87.28 261.79 L89.04 257.37 L90.8 253.01 L92.56 248.72 L94.32 244.5 L96.08 240.35 L97.84 236.26 L99.6 232.24 L101.36 228.28 L103.12 224.4 L104.88 220.58 L106.64 216.83 L108.4 213.14 L110.16 209.53 L111.92 205.98 L113.68 202.5 L115.44 199.08 L117.2 195.73 L118.96 192.45 L120.72 189.24 L122.48 186.09 L124.24 183.01 L126 180"/>
