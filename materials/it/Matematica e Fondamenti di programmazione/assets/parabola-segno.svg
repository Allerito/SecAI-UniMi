<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Segno di una parabola con due radici reali</title>
  <desc id="desc">Con concavità verso l'alto la parabola è positiva fuori dalle radici e negativa tra esse. Con concavità verso il basso vale il contrario.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .panel { fill: #f8fafc; stroke: #d0d5dd; stroke-width: 1.5; }
    .grid { stroke: #e4e7ec; stroke-width: 1; }
    .axis { stroke: #344054; stroke-width: 2; }
    .txt { fill: #1d2939; font: 600 18px system-ui, sans-serif; }
    .small { fill: #475467; font: 15px system-ui, sans-serif; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; }
    .positive { stroke: #1677b8; fill: none; stroke-width: 4.8; stroke-linecap: round; }
    .negative { stroke: #d05a32; fill: none; stroke-width: 4.8; stroke-linecap: round; }
    .root { fill: #ffffff; stroke: #344054; stroke-width: 3; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #17191f; }
      .panel { fill: #20242d; stroke: #475467; }
      .grid { stroke: #343946; }
      .axis { stroke: #d0d5dd; }
      .txt { fill: #f2f4f7; }
      .small { fill: #d0d5dd; stroke: #20242d; }
      .root { fill: #17191f; stroke: #d0d5dd; }
      .positive { stroke: #64b5e8; }
      .negative { stroke: #f08a67; }
    }
  </style>
  <rect class="bg" width="900" height="520" rx="12"/>
  <text class="txt" x="32" y="38">Δ &gt; 0: il segno cambia attraversando ciascuna radice</text>

