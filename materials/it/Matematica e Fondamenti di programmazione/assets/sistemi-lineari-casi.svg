<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Tre possibili esiti di un sistema lineare</title><desc id="desc">Due rette incidenti rappresentano una soluzione unica, due parallele nessuna soluzione e due coincidenti infinite soluzioni.</desc>
  <style>:root{color-scheme:light dark}.bg{fill:#fff}.panel{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.axis{stroke:#cbd5e1}.r1{stroke:#2563eb;stroke-width:5}.r2{stroke:#f97316;stroke-width:5}.point{fill:#059669}.txt{fill:#0f172a;font:23px system-ui,sans-serif}.small{fill:#334155;font:18px system-ui,sans-serif}@media(prefers-color-scheme:dark){.bg{fill:#17191f}.panel{fill:#20242d;stroke:#475569}.axis{stroke:#475569}.txt{fill:#f8fafc}.small{fill:#cbd5e1}.r1{stroke:#60a5fa}.r2{stroke:#fb923c}.point{fill:#34d399}}</style>
  <rect class="bg" width="1200" height="430" rx="14"/>
  <g transform="translate(15 15)"><rect class="panel" width="380" height="400" rx="12"/><text class="txt" x="190" y="40" text-anchor="middle">Una soluzione</text><path class="axis" d="M45 330H340M75 365V75"/><path class="r1" d="M55 320L325 105"/><path class="r2" d="M70 95L320 335"/><circle class="point" cx="193" cy="210" r="9"/><text class="small" x="190" y="375" text-anchor="middle">due rette incidenti</text></g>
  <g transform="translate(410 15)"><rect class="panel" width="380" height="400" rx="12"/><text class="txt" x="190" y="40" text-anchor="middle">Nessuna soluzione</text><path class="axis" d="M45 330H340M75 365V75"/><path class="r1" d="M55 285L325 100"/><path class="r2" d="M55 345L325 160"/><text class="small" x="190" y="375" text-anchor="middle">due rette parallele distinte</text></g>
  <g transform="translate(805 15)"><rect class="panel" width="380" height="400" rx="12"/><text class="txt" x="190" y="40" text-anchor="middle">Infinite soluzioni</text><path class="axis" d="M45 330H340M75 365V75"/><path class="r2" d="M55 320L325 105"/><path class="r1" d="M55 320L325 105" stroke-dasharray="14 10"/><text class="small" x="190" y="375" text-anchor="middle">due equazioni della stessa retta</text></g>
</svg>
