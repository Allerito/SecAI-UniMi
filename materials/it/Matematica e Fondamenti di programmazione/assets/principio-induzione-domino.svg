<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc">
  <title id="title">Il principio di induzione come una catena di domino</title>
  <desc id="desc">Il passo base avvia la catena; l'implicazione da P di k a P di k più uno garantisce che il processo prosegua.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg{fill:#fff}.ground{stroke:#64748b;stroke-width:4}.tile{fill:#60a5fa;stroke:#1d4ed8;stroke-width:3}.next{fill:#a78bfa;stroke:#7c3aed;stroke-width:3}
    .arrow{stroke:#f97316;stroke-width:5;fill:none;marker-end:url(#head)}.txt{fill:#0f172a;font:24px system-ui,sans-serif}.small{fill:#334155;font:19px system-ui,sans-serif}
    @media(prefers-color-scheme:dark){.bg{fill:#17191f}.ground{stroke:#94a3b8}.txt{fill:#f8fafc}.small{fill:#cbd5e1}}
  </style>
  <defs><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f97316"/></marker></defs>
  <rect class="bg" width="1100" height="410" rx="14"/><path class="ground" d="M45 310H1050"/>
  <g transform="translate(100 0) rotate(24 35 310)"><rect class="tile" x="0" y="125" width="70" height="185" rx="8"/><text class="txt" x="35" y="230" text-anchor="middle">P(n₀)</text></g>
  <g transform="translate(300 0) rotate(16 35 310)"><rect class="tile" x="0" y="125" width="70" height="185" rx="8"/><text class="txt" x="35" y="230" text-anchor="middle">P(k)</text></g>
  <g transform="translate(520 0) rotate(7 35 310)"><rect class="next" x="0" y="125" width="80" height="185" rx="8"/><text class="txt" x="40" y="230" text-anchor="middle">P(k+1)</text></g>
  <rect class="tile" x="760" y="125" width="80" height="185" rx="8"/><text class="txt" x="800" y="230" text-anchor="middle">…</text>
  <rect class="tile" x="950" y="125" width="80" height="185" rx="8"/><text class="txt" x="990" y="230" text-anchor="middle">P(n)</text>
  <path class="arrow" d="M165 100C220 55 275 55 320 100"/><text class="small" x="245" y="45" text-anchor="middle">il passo base avvia la catena</text>
  <path class="arrow" d="M390 110C440 75 490 75 530 110"/><text class="small" x="460" y="68" text-anchor="middle">P(k) ⇒ P(k+1)</text>
  <path class="arrow" d="M620 105C690 70 740 70 785 105"/>
  <text class="small" x="550" y="365" text-anchor="middle">base + collegamento valido per ogni k = proprietà vera per tutti gli indici</text>
</svg>
