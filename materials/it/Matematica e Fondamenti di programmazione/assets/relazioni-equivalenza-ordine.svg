<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="title desc">
  <title id="title">Equivalenza e ordine parziale</title>
  <desc id="desc">A sinistra un insieme diviso in tre classi di equivalenza; a destra il diagramma di Hasse delle parti di un insieme con due elementi.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill:#fff; } .panel { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; }
    .txt { fill:#0f172a; font:24px system-ui,sans-serif; } .small { fill:#334155; font:19px system-ui,sans-serif; }
    .class1 { fill:#38bdf8; fill-opacity:.45; stroke:#0284c7; stroke-width:3; }
    .class2 { fill:#a78bfa; fill-opacity:.45; stroke:#7c3aed; stroke-width:3; }
    .class3 { fill:#34d399; fill-opacity:.45; stroke:#059669; stroke-width:3; }
    .edge { stroke:#64748b; stroke-width:4; } .node { fill:#fff; stroke:#2563eb; stroke-width:3; }
    @media (prefers-color-scheme: dark) { .bg{fill:#17191f}.panel{fill:#20242d;stroke:#475569}.txt{fill:#f8fafc}.small{fill:#cbd5e1}.node{fill:#20242d;stroke:#60a5fa}.edge{stroke:#94a3b8} }
  </style>
  <rect class="bg" width="1100" height="500" rx="14"/>
  <g transform="translate(20 20)">
    <rect class="panel" width="520" height="460" rx="12"/>
    <text class="txt" x="260" y="42" text-anchor="middle">Classi di equivalenza</text>
    <rect x="55" y="82" width="410" height="300" rx="70" fill="none" stroke="#64748b" stroke-width="3"/>
    <ellipse class="class1" cx="145" cy="225" rx="55" ry="110"/><ellipse class="class2" cx="260" cy="225" rx="55" ry="110"/><ellipse class="class3" cx="375" cy="225" rx="55" ry="110"/>
    <text class="small" x="145" y="230" text-anchor="middle">[0]</text><text class="small" x="260" y="230" text-anchor="middle">[1]</text><text class="small" x="375" y="230" text-anchor="middle">[2]</text>
    <text class="small" x="260" y="420" text-anchor="middle">blocchi disgiunti che ricoprono A</text>
  </g>
  <g transform="translate(560 20)">
    <rect class="panel" width="520" height="460" rx="12"/>
    <text class="txt" x="260" y="42" text-anchor="middle">Ordine parziale per inclusione</text>
    <path class="edge" d="M260 120L145 230M260 120L375 230M145 230L260 350M375 230L260 350"/>
    <rect class="node" x="205" y="85" width="110" height="55" rx="12"/><rect class="node" x="90" y="202" width="110" height="55" rx="12"/>
    <rect class="node" x="320" y="202" width="110" height="55" rx="12"/><rect class="node" x="205" y="322" width="110" height="55" rx="12"/>
    <text class="small" x="260" y="120" text-anchor="middle">{a,b}</text><text class="small" x="145" y="237" text-anchor="middle">{a}</text>
    <text class="small" x="375" y="237" text-anchor="middle">{b}</text><text class="small" x="260" y="357" text-anchor="middle">∅</text>
    <text class="small" x="260" y="420" text-anchor="middle">{a} e {b} sono incomparabili</text>
  </g>
</svg>
