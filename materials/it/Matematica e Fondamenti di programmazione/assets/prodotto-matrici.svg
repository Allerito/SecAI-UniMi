<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">Prodotto righe per colonne</title>
  <desc id="desc">La seconda riga della prima matrice viene moltiplicata scalarmente per la terza colonna della seconda matrice per ottenere l'elemento c due tre.</desc>
  <style>
    :root { color-scheme: light dark; }
    .bg { fill: #ffffff; }
    .cell { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
    .row { fill: #bfdbfe; stroke: #2563eb; stroke-width: 2.2; }
    .col { fill: #ddd6fe; stroke: #7c3aed; stroke-width: 2.2; }
    .out { fill: #bbf7d0; stroke: #059669; stroke-width: 2.5; }
    .txt { fill: #0f172a; font: 600 23px system-ui, sans-serif; }
    .small { fill: #1e293b; font: 600 18px system-ui, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #17191f; }
      .cell { fill: #20242d; stroke: #64748b; }
      .row { fill: #1e40af; stroke: #60a5fa; }
      .col { fill: #5b21b6; stroke: #c4b5fd; }
      .out { fill: #166534; stroke: #34d399; }
      .txt { fill: #f8fafc; }
      .small { fill: #f1f5f9; }
    }
  </style>
  <rect class="bg" width="1120" height="430" rx="14"/>
  <text class="txt" x="560" y="42" text-anchor="middle">Prodotto righe per colonne: A(m×n) · B(n×p) = C(m×p)</text>

  <g transform="translate(85 95)">
    <text class="txt" x="120" y="-16" text-anchor="middle">A (riga 2)</text>
    <rect class="cell" x="0" y="0" width="80" height="65"/><rect class="cell" x="80" y="0" width="80" height="65"/><rect class="cell" x="160" y="0" width="80" height="65"/>
    <rect class="row" x="0" y="65" width="80" height="65"/><rect class="row" x="80" y="65" width="80" height="65"/><rect class="row" x="160" y="65" width="80" height="65"/>
    <rect class="cell" x="0" y="130" width="80" height="65"/><rect class="cell" x="80" y="130" width="80" height="65"/><rect class="cell" x="160" y="130" width="80" height="65"/>
    <text class="small" x="40" y="104" text-anchor="middle">a₂₁</text>
    <text class="small" x="120" y="104" text-anchor="middle">a₂₂</text>
    <text class="small" x="200" y="104" text-anchor="middle">a₂₃</text>
  </g>

  <text class="txt" x="382" y="200" text-anchor="middle">·</text>

  <g transform="translate(440 95)">
    <text class="txt" x="120" y="-16" text-anchor="middle">B (colonna 3)</text>
    <rect class="cell" x="0" y="0" width="80" height="65"/><rect class="cell" x="80" y="0" width="80" height="65"/><rect class="col" x="160" y="0" width="80" height="65"/>
    <rect class="cell" x="0" y="65" width="80" height="65"/><rect class="cell" x="80" y="65" width="80" height="65"/><rect class="col" x="160" y="65" width="80" height="65"/>
    <rect class="cell" x="0" y="130" width="80" height="65"/><rect class="cell" x="80" y="130" width="80" height="65"/><rect class="col" x="160" y="130" width="80" height="65"/>
    <text class="small" x="200" y="39" text-anchor="middle">b₁₃</text>
    <text class="small" x="200" y="104" text-anchor="middle">b₂₃</text>
    <text class="small" x="200" y="169" text-anchor="middle">b₃₃</text>
  </g>

  <text class="txt" x="738" y="200" text-anchor="middle">=</text>

  <g transform="translate(795 95)">
    <text class="txt" x="120" y="-16" text-anchor="middle">C (elemento c₂₃)</text>
    <rect class="cell" x="0" y="0" width="80" height="65"/><rect class="cell" x="80" y="0" width="80" height="65"/><rect class="cell" x="160" y="0" width="80" height="65"/>
    <rect class="cell" x="0" y="65" width="80" height="65"/><rect class="cell" x="80" y="65" width="80" height="65"/><rect class="out" x="160" y="65" width="80" height="65"/>
    <rect class="cell" x="0" y="130" width="80" height="65"/><rect class="cell" x="80" y="130" width="80" height="65"/><rect class="cell" x="160" y="130" width="80" height="65"/>
    <text class="small" x="200" y="104" text-anchor="middle">c₂₃</text>
  </g>

  <text class="small" x="560" y="365" text-anchor="middle">c₂₃ = a₂₁ · b₁₃ + a₂₂ · b₂₃ + a₂₃ · b₃₃</text>
</svg>
