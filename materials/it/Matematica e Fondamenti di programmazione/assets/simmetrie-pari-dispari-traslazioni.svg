    <circle class="pt" cx="81.6" cy="159.94" r="5"/>
    <circle class="pt" cx="210.4" cy="159.94" r="5"/>
    <text class="sub" x="81.6" y="203" text-anchor="middle">-x</text>
    <text class="sub" x="210.4" y="203" text-anchor="middle">x</text>
    <text class="caption" x="146" y="290" text-anchor="middle">Simmetria rispetto all'asse y</text>
  </g>

  <g transform="translate(334 20)">
    <rect class="panel" width="292" height="310" rx="10"/>
    <text class="txt" x="146" y="30" text-anchor="middle">Funzione Dispari: f(-x) = -f(x)</text>
    <line class="dash" x1="74" y1="192.13" x2="218" y2="117.88"/>
