    <line class="vec" x1="100" y1="205" x2="174.2" y2="168.4"/>
    <circle class="pt" cx="100" cy="205" r="4.5"/>
    <circle class="pt" cx="179.2" cy="165.4" r="5"/>
    <text class="sub" x="189.2" y="170.4" text-anchor="start">V'(a, b)</text>
    <text class="caption" x="146" y="272" text-anchor="middle">Vettore v = (a, b)</text>
    <text class="caption" x="146" y="292" text-anchor="middle">Spostamento (+a, +b)</text>
  </g>
</svg>
