    <circle class="pt" cx="74" cy="192.13" r="5"/>
    <circle class="pt" cx="146" cy="155" r="4.5"/>
    <circle class="pt" cx="218" cy="117.88" r="5"/>
    <text class="sub" x="74" y="147" text-anchor="middle">-x</text>
    <text class="sub" x="218" y="173" text-anchor="middle">x</text>
    <text class="caption" x="146" y="290" text-anchor="middle">Simmetria rispetto all'origine O</text>
  </g>

  <g transform="translate(648 20)">
    <rect class="panel" width="292" height="310" rx="10"/>
    <text class="txt" x="146" y="30" text-anchor="middle">Traslazione: y = f(x - a) + b</text>
    <line class="axis" x1="25" y1="205" x2="267" y2="205"/>
    <line class="axis" x1="100" y1="250" x2="100" y2="52"/>
