<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
  <title id="title">Funzione logaritmica per base maggiore di 1 e base tra 0 e 1</title>
  <desc id="desc">Grafici esatti di y = log_a(x) per a maggiore di 1 (crescente) e per 0 minore di a minore di 1 (decrescente), entrambi passanti per (1,0) e (a,1).</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --panel: #f8fafc;
      --border: #cbd5e1;
      --grid: #e2e8f0;
      --axis: #334155;
      --txt: #0f172a;
      --sub: #334155;
      --blue: #0284c7;
      --purple: #7c3aed;
      --red: #e11d48;
      --orange: #d97706;
      --green: #16a34a;
      --muted: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --panel: #1e2028;
        --border: #3f4454;
        --grid: #2c303d;
        --axis: #cbd5e1;
        --txt: #f8fafc;
        --sub: #cbd5e1;
        --blue: #38bdf8;
        --purple: #a78bfa;
        --red: #fb7185;
        --orange: #fbbf24;
        --green: #4ade80;
        --muted: #94a3b8;
      }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .grid { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 4 4; }
    .axis { stroke: var(--axis); stroke-width: 2; fill: none; }
    . guide, .dash { stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .asym { stroke: var(--red); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .hline { stroke: var(--orange); stroke-width: 2.2; stroke-dasharray: 6 4; fill: none; }
    .c-blue { stroke: var(--blue); fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .c-purple { stroke: var(--purple); fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .c-red { stroke: var(--red); fill: none; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
    .c-green { stroke: var(--green); fill: none; stroke-width: 3.5; stroke-dasharray: 7 4; stroke-linecap: round; }
    .pt { fill: var(--bg); stroke: var(--green); stroke-width: 3.2; }
    .pt-red { fill: var(--bg); stroke: var(--red); stroke-width: 3.2; }
    .txt { fill: var(--txt); font: 600 18px system-ui, -apple-system, sans-serif; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
    .title-bg { fill: var(--txt); font: 600 18px system-ui, -apple-system, sans-serif; }
    .sub { fill: var(--sub); font: 14.5px system-ui, -apple-system, sans-serif; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
    .caption { fill: var(--sub); font: 14.5px system-ui, -apple-system, sans-serif; }
</style>
  <rect class="bg" width="920" height="350" rx="12"/>

