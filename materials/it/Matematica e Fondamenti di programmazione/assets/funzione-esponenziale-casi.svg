<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" role="img" aria-labelledby="title desc">
  <title id="title">Funzione esponenziale e risoluzione grafica di equazioni e disequazioni</title>
  <desc id="desc">Confronto tra funzione esponenziale con base maggiore di 1 (strettamente crescente) e base compresa tra 0 e 1 (strettamente decrescente).</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --panel: #f8fafc;
      --border: #cbd5e1;
      --grid: #e2e8f0;
      --axis: #334155;
      --txt: #0f172a;
      --sub: #334155;
      --blue: #0284c7;
      --purple: #7c3aed;
      --red: #e11d48;
      --orange: #d97706;
      --green: #16a34a;
      --muted: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618;
        --panel: #1e2028;
        --border: #3f4454;
        --grid: #2c303d;
        --axis: #cbd5e1;
        --txt: #f8fafc;
        --sub: #cbd5e1;
        --blue: #38bdf8;
        --purple: #a78bfa;
        --red: #fb7185;
        --orange: #fbbf24;
        --green: #4ade80;
        --muted: #94a3b8;
      }
    }
    .bg { fill: var(--bg); }
    .panel { fill: var(--panel); stroke: var(--border); stroke-width: 1.5; }
    .grid { stroke: var(--grid); stroke-width: 1; stroke-dasharray: 4 4; }
    .axis { stroke: var(--axis); stroke-width: 2; fill: none; }
    . guide, .dash { stroke: var(--muted); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .asym { stroke: var(--red); stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .hline { stroke: var(--orange); stroke-width: 2.2; stroke-dasharray: 6 4; fill: none; }
    .c-blue { stroke: var(--blue); fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .c-purple { stroke: var(--purple); fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .c-red { stroke: var(--red); fill: none; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; }
    .c-green { stroke: var(--green); fill: none; stroke-width: 3.5; stroke-dasharray: 7 4; stroke-linecap: round; }
    .pt { fill: var(--bg); stroke: var(--green); stroke-width: 3.2; }
    .pt-red { fill: var(--bg); stroke: var(--red); stroke-width: 3.2; }
    .txt { fill: var(--txt); font: 600 18px system-ui, -apple-system, sans-serif; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
    .title-bg { fill: var(--txt); font: 600 18px system-ui, -apple-system, sans-serif; }
    .sub { fill: var(--sub); font: 14.5px system-ui, -apple-system, sans-serif; paint-order: stroke; stroke: var(--panel); stroke-width: 4px; stroke-linejoin: round; }
    .caption { fill: var(--sub); font: 14.5px system-ui, -apple-system, sans-serif; }
</style>
  <rect class="bg" width="920" height="350" rx="12"/>

  <g transform="translate(22 20)">
    <rect class="panel" width="424" height="310" rx="10"/>
    <text class="txt" x="20" y="32">Caso a &gt; 1 (strettamente crescente)</text>
    <line class="hline" x1="38" y1="122.32" x2="390" y2="122.32"/>
    <line class="dash" x1="276.6" y1="122.32" x2="276.6" y2="228"/>
    <line class="axis" x1="38" y1="228" x2="395" y2="228"/>
    <line class="axis" x1="195" y1="255" x2="195" y2="52"/>
    <path class="c-blue" d="M45.4 217.99 L48.13 217.71 L50.87 217.41 L53.6 217.12 L56.33 216.81 L59.07 216.49 L61.8 216.17 L64.54 215.83 L67.27 215.49 L70 215.14 L72.74 214.77 L75.47 214.4 L78.2 214.01 L80.94 213.62 L83.67 213.21 L86.4 212.79 L89.14 212.36 L91.87 211.92 L94.6 211.47 L97.34 211 L100.07 210.52 L102.81 210.03 L105.54 209.52 L108.27 209 L111.01 208.46 L113.74 207.91 L116.47 207.34 L119.21 206.76 L121.94 206.16 L124.67 205.54 L127.41 204.9 L130.14 204.25 L132.88 203.58 L135.61 202.89 L138.34 202.18 L141.08 201.45 L143.81 200.7 L146.54 199.93 L149.28 199.14 L152.01 198.32 L154.74 197.48 L157.48 196.62 L160.21 195.73 L162.94 194.82 L165.68 193.88 L168.41 192.92 L171.15 191.93 L173.88 190.91 L176.61 189.86 L179.35 188.78 L182.08 187.68 L184.81 186.54 L187.55 185.37 L190.28 184.16 L193.01 182.92 L195.75 181.65 L198.48 180.34 L201.22 178.99 L203.95 177.61 L206.68 176.18 L209.42 174.72 L212.15 173.21 L214.88 171.66 L217.62 170.07 L220.35 168.44 L223.08 166.75 L225.82 165.02 L228.55 163.24 L231.28 161.41 L234.02 159.53 L236.75 157.6 L239.49 155.61 L242.22 153.56 L244.95 151.46 L247.69 149.3 L250.42 147.07 L253.15 144.79 L255.89 142.43 L258.62 140.02 L261.35 137.53 L264.09 134.97 L266.82 132.35 L269.56 129.64 L272.29 126.86 L275.02 124.01 L277.76 121.07 L280.49 118.05 L283.22 114.94 L285.96 111.74 L288.69 108.46 L291.42 105.08 L294.16 101.61 L296.89 98.04 L299.62 94.36 L302.36 90.59 L305.09 86.71 L307.83 82.71 L310.56 78.61 L313.29 74.39 L316.03 70.05 L318.76 65.58"/>
    <circle class="pt" cx="195" cy="182" r="5"/>
    <circle class="pt" cx="276.6" cy="122.32" r="5"/>
    <text class="sub" x="185" y="174" text-anchor="end">(0, 1)</text>
    <text class="sub" x="385" y="114.32" text-anchor="end">y = aⁿ</text>
    <text class="sub" x="276.6" y="248" text-anchor="middle">x = n</text>
    <text class="caption" x="212" y="290" text-anchor="middle">aˣ &gt; aⁿ ⟺ x &gt; n (il verso della disequazione si conserva)</text>
  </g>

  <g transform="translate(474 20)">
    <rect class="panel" width="424" height="310" rx="10"/>
    <text class="txt" x="20" y="32">Caso 0 &lt; a &lt; 1 (strettamente decrescente)</text>
    <line class="hline" x1="38" y1="122.32" x2="390" y2="122.32"/>
    <line class="dash" x1="143.4" y1="122.32" x2="143.4" y2="228"/>
    <line class="axis" x1="38" y1="228" x2="395" y2="228"/>
    <line class="axis" x1="225" y1="255" x2="225" y2="52"/>
    <path class="c-red" d="M101.24 65.58 L103.97 70.05 L106.71 74.39 L109.44 78.61 L112.17 82.71 L114.91 86.71 L117.64 90.59 L120.38 94.36 L123.11 98.04 L125.84 101.61 L128.58 105.08 L131.31 108.46 L134.04 111.74 L136.78 114.94 L139.51 118.05 L142.24 121.07 L144.98 124.01 L147.71 126.86 L150.44 129.64 L153.18 132.35 L155.91 134.97 L158.65 137.53 L161.38 140.02 L164.11 142.43 L166.85 144.79 L169.58 147.07 L172.31 149.3 L175.05 151.46 L177.78 153.56 L180.51 155.61 L183.25 157.6 L185.98 159.53 L188.72 161.41 L191.45 163.24 L194.18 165.02 L196.92 166.75 L199.65 168.44 L202.38 170.07 L205.12 171.66 L207.85 173.21 L210.58 174.72 L213.32 176.18 L216.05 177.61 L218.78 178.99 L221.52 180.34 L224.25 181.65 L226.99 182.92 L229.72 184.16 L232.45 185.37 L235.19 186.54 L237.92 187.68 L240.65 188.78 L243.39 189.86 L246.12 190.91 L248.85 191.93 L251.59 192.92 L254.32 193.88 L257.06 194.82 L259.79 195.73 L262.52 196.62 L265.26 197.48 L267.99 198.32 L270.72 199.14 L273.46 199.93 L276.19 200.7 L278.92 201.45 L281.66 202.18 L284.39 202.89 L287.12 203.58 L289.86 204.25 L292.59 204.9 L295.33 205.54 L298.06 206.16 L300.79 206.76 L303.53 207.34 L306.26 207.91 L308.99 208.46 L311.73 209 L314.46 209.52 L317.19 210.03 L319.93 210.52 L322.66 211 L325.4 211.47 L328.13 211.92 L330.86 212.36 L333.6 212.79 L336.33 213.21 L339.06 213.62 L341.8 214.01 L344.53 214.4 L347.26 214.77 L350 215.14 L352.73 215.49 L355.46 215.83 L358.2 216.17 L360.93 216.49 L363.67 216.81 L366.4 217.12 L369.13 217.41 L371.87 217.71 L374.6 217.99"/>
    <circle class="pt" cx="225" cy="182" r="5"/>
    <circle class="pt" cx="143.4" cy="122.32" r="5"/>
    <text class="sub" x="235" y="174" text-anchor="start">(0, 1)</text>
    <text class="sub" x="45" y="114.32" text-anchor="start">y = aⁿ</text>
    <text class="sub" x="143.4" y="248" text-anchor="middle">x = n</text>
    <text class="caption" x="212" y="290" text-anchor="middle">aˣ &gt; aⁿ ⟺ x &lt; n (il verso della disequazione si inverte!)</text>
  </g>
</svg>
